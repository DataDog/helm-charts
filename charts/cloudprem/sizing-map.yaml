# CPU requests and memory requests/limits subtract GKE node reservations plus a
# fixed per-node budget of 250m CPU and 512Mi memory for DaemonSets and add-ons.
# CPU reservation by size: 70m, 80m, 90m, 110m, 130m, 150m.
# Memory reservation is GKE's tiered memory reservation plus 100Mi eviction.
# Memory reservation by size: 1944Mi, 2763Mi, 3746Mi, 5712Mi, 7678Mi, 9644Mi.
# Resource requests/limits are rounded down to the nearest 100m/Mi to preserve headroom.
# Quickwit memory tuning below uses the allocatable memory rounded down to Gi.
large:
  resources:
    limits:
      memory: 5700Mi
    requests:
      cpu: 1600m
      memory: 5700Mi
  config:
    # Indexer settings
    indexer:
      split_store_max_num_bytes: 200G
      split_store_max_num_splits: 10000
    # Ingest API settings
    ingest_api:
      max_queue_memory_usage: 1.5GiB
      max_queue_disk_usage: 3GiB
    # Searcher settings
    searcher:
      fast_field_cache_capacity: 2.03125G
      split_footer_cache_capacity: 156.25M
      partial_request_cache_capacity: 78.125M
      max_num_concurrent_split_searches: 16
      aggregation_memory_limit: 500M

