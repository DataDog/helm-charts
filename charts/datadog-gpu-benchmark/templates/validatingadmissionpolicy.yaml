{{- if and .Values.admissionPolicy.enabled (eq (include "gpu-benchmark.admissionPolicySupported" .) "true") }}
{{- $repositories := concat .Values.admissionPolicy.imageRepositories (ternary (list .Values.podOverrides.imageRepository) list (ne .Values.podOverrides.imageRepository "")) | uniq }}
{{- $env := concat (list "GPU_BENCHMARK_AIPERF_CONFIG" "HOME" "AIPERF_API_SERVER_PORT" "AIPERF_API_SERVER_HOST" "AIPERF_UI_REALTIME_METRICS_ENABLED" "AIPERF_UI_REALTIME_METRICS_INTERVAL") .Values.admissionPolicy.extraEnv | uniq }}
# Admits benchmark Jobs and pods of the benchmark namespace only if they have the shape Datadog's
# benchmark worker creates. Holding the Cluster Agent's credentials is then not enough to run
# arbitrary code there: only Datadog's image, with its own command, environment and volumes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "gpu-benchmark.fullname" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ include "gpu-benchmark.namespace" . }}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # pods/ephemeralcontainers: no debug container in a benchmark pod either.
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: spec
      expression: "object.kind == 'Job' ? object.spec.template.spec : object.spec"
    - name: repositories
      expression: '{{ toJson $repositories }}'
    - name: allowedEnv
      expression: '{{ toJson $env }}'
  validations:
    - expression: "size(variables.spec.containers) == 1"
      message: "benchmark pods have exactly one container"
    - expression: "!has(variables.spec.initContainers) || size(variables.spec.initContainers) == 0"
      message: "benchmark pods have no init containers"
    - expression: "!has(variables.spec.ephemeralContainers) || size(variables.spec.ephemeralContainers) == 0"
      message: "benchmark pods have no ephemeral containers"
    - expression: >-
        variables.repositories.exists(r,
          variables.spec.containers[0].image.startsWith(r + '@sha256:') ||
          (variables.spec.containers[0].image.startsWith(r + ':') && variables.spec.containers[0].image.contains('@sha256:')))
      messageExpression: "'image ' + variables.spec.containers[0].image + ' is not a Datadog benchmark image pinned by digest; allowed repositories: ' + variables.repositories.join(', ')"
    - expression: >-
        !has(variables.spec.containers[0].command) ||
        ({{ .Values.admissionPolicy.allowInlineScript }} &&
          size(variables.spec.containers[0].command) == 3 &&
          variables.spec.containers[0].command[0] == 'python' &&
          variables.spec.containers[0].command[1] == '-c')
      message: "benchmark containers run the image's own entrypoint{{ if .Values.admissionPolicy.allowInlineScript }} or Datadog's `python -c` benchmark script{{ end }}"
    - expression: "!has(variables.spec.containers[0].args) || size(variables.spec.containers[0].args) == 0"
      message: "benchmark containers have no args"
    - expression: >-
        !has(variables.spec.containers[0].env) ||
        variables.spec.containers[0].env.all(e,
          e.name in variables.allowedEnv && (!has(e.valueFrom) || has(e.valueFrom.secretKeyRef)))
      messageExpression: "'benchmark containers only set ' + variables.allowedEnv.join(', ') + ', with literal values or Secret references'"
    - expression: "!has(variables.spec.containers[0].envFrom) || size(variables.spec.containers[0].envFrom) == 0"
      message: "benchmark containers have no envFrom"
    - expression: "!has(variables.spec.volumes) || variables.spec.volumes.all(v, has(v.emptyDir))"
      message: "benchmark pods only have emptyDir volumes"
    - expression: >-
        !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) &&
        !(has(variables.spec.hostPID) && variables.spec.hostPID) &&
        !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
      message: "benchmark pods share no host namespace"
    - expression: >-
        has(variables.spec.automountServiceAccountToken) && !variables.spec.automountServiceAccountToken &&
        has(variables.spec.serviceAccountName) && variables.spec.serviceAccountName == '{{ include "gpu-benchmark.runServiceAccount" . }}'
      message: "benchmark pods run as {{ include "gpu-benchmark.runServiceAccount" . }}, without a ServiceAccount token"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "gpu-benchmark.fullname" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
spec:
  policyName: {{ include "gpu-benchmark.fullname" . }}
  validationActions: ["Deny"]
{{- end }}
