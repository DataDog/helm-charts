# The ServiceAccount of benchmark pods. No role and no token: they never call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-benchmark.runServiceAccount" . }}
  namespace: {{ include "gpu-benchmark.namespace" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
automountServiceAccountToken: false
