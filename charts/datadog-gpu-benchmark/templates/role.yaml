{{- if .Values.rbac.create }}
# What the Cluster Agent's Private Action Runner needs to run benchmarks, in the benchmark
# namespace only: create, read and delete the run's Job, read its pod and logs, and read the
# pod overrides.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gpu-benchmark.fullname" . }}
  namespace: {{ include "gpu-benchmark.namespace" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "gpu-benchmark.podOverridesConfigMap" . | quote }}]
    verbs: ["get"]
{{- end }}
