{{- if .Values.rbac.create }}
# What the Cluster Agent's Private Action Runner needs for Datadog's benchmark actions, in the
# benchmark namespace only: kubernetes.batch.createJob, getJob, deleteJob; kubernetes.core.listPod
# (finds the run's pod), getPodLogs (progress and results) and getConfigMap, for the pod overrides
# only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gpu-benchmark.fullname" . }}
  namespace: {{ include "gpu-benchmark.namespace" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "gpu-benchmark.podOverridesConfigMap" . | quote }}]
    verbs: ["get"]
{{- end }}
