# Read by Datadog when it creates a run's Job: placement, labels and image mirror for benchmark
# pods, from podOverrides. Datadog sets everything else, as the admission policy requires.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu-benchmark.podOverridesConfigMap" . }}
  namespace: {{ include "gpu-benchmark.namespace" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
data:
  overrides.json: |
    {{- include "gpu-benchmark.podOverrides" . | nindent 4 }}
