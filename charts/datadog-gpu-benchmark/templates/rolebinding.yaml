{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-benchmark.fullname" . }}
  namespace: {{ include "gpu-benchmark.namespace" . }}
  labels:
    {{- include "gpu-benchmark.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gpu-benchmark.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterAgent.serviceAccount.name }}
    namespace: {{ .Values.clusterAgent.serviceAccount.namespace }}
{{- end }}
