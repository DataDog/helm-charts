{{- if and .Values.rbac.create .Values.datadogBYOCCluster.enabled (semverCompare ">=1.32.0-0" (include "check-image-tag" .)) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "datadog-operator.fullname" . }}-byoc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "datadog-operator.fullname" . }}-byoc
subjects:
  - kind: ServiceAccount
    name: {{ template "datadog-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
