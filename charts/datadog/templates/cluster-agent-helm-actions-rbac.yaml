{{- $dcaImageTag := .Values.clusterAgent.image.tag | toString }}
{{- if and .Values.datadog.kubernetesActions.helmActions.enabled (eq (include "cluster-agent-enabled" .) "true") (or .Values.clusterAgent.image.doNotCheckTag (hasPrefix "latest" $dcaImageTag) (semverCompare ">=7.85.0-0" $dcaImageTag)) }}
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-action-caller
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    # `create` is required. get/list/watch let the CLI (or a future --wait
    # flag) observe the Job. `delete` is optional: TTL-after-finished handles
    # cleanup automatically, but `delete` is useful for manual re-runs.
    verbs:
      - create
      - get
      - list
      - watch
      - delete
---
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-action-caller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "datadog.fullname" . }}-helm-action-caller
subjects:
  - kind: ServiceAccount
    name: {{ if .Values.clusterAgent.rbac.create }}{{ template "datadog.fullname" . }}-cluster-agent{{ else }}"{{ .Values.clusterAgent.rbac.serviceAccountName }}"{{ end }}
    namespace: {{ .Release.Namespace }}
---
# ServiceAccount for the Job performing the Helm action
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-actions
  namespace: {{ .Release.Namespace }}
---
# ClusterRole granting Helm release storage access (secrets driver)
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-release-storage
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-release-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "datadog.fullname" . }}-helm-release-storage
subjects:
  - kind: ServiceAccount
    name: {{ template "datadog.fullname" . }}-helm-actions
    namespace: {{ .Release.Namespace }}
---
# ClusterRole granting the Job access to the resources a Helm release can alter.
# This needs to be extended every time a customer's chart adds a new resource type.
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-to-resources
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  labels:
{{ include "datadog.labels" . | indent 4 }}
  name: {{ template "datadog.fullname" . }}-helm-to-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "datadog.fullname" . }}-helm-to-resources
subjects:
  - kind: ServiceAccount
    name: {{ template "datadog.fullname" . }}-helm-actions
    namespace: {{ .Release.Namespace }}
{{- end }}
