dependencies:
  - name: datadog-crds
    version: 2.23.0
    repository: https://helm.datadoghq.com
    # Ordering matters here. Helm uses the first condition with a defined (non-nil) value. Conditions with an
    # explicit false default (e.g. clusterAgent.metricsProvider.useDatadogMetrics) must come last, otherwise
    # the condition stops evaluation even if the subsequent condition would've been true.
    condition: datadog.autoscaling.workload.enabled,clusterAgent.metricsProvider.useDatadogMetrics
    tags:
    - install-crds
  - name: datadog-instrumentation-crd
    version: 0.1.0
    repository: file://../datadog-instrumentation-crd
    condition: datadog.instrumentationCrd.enabled
    tags:
    - install-crds
  - name: kube-state-metrics
    version: 2.13.2
    repository: https://prometheus-community.github.io/helm-charts
    condition: datadog.kubeStateMetricsEnabled
  - name: datadog-csi-driver
    version: 0.17.0
    repository: https://helm.datadoghq.com
    condition: datadog.csi.enabled
  - name: datadog-operator
    version: 2.25.0
    repository: https://helm.datadoghq.com
    condition: datadog.operator.enabled
    alias: operator
