name: Check Operator ClusterRole

# Fails when the auto-generated section of the datadog-operator ClusterRole is
# edited by hand. The lines between the BEGIN and END AUTO-GENERATED RULES
# markers are regenerated from the upstream operator config/rbac/role.yaml by
# scripts/update-clusterrole.py on every operator release, so hand edits there
# get silently dropped. Manual RBAC patches belong after the END marker, which
# the script preserves. clusterrole_byoc.yaml is checked the same way against
# config/rbac/byoc/role.yaml.
on:
  pull_request:
    paths:
      - "charts/datadog-operator/templates/clusterrole.yaml"
      - "charts/datadog-operator/templates/clusterrole_byoc.yaml"
      - "scripts/update-clusterrole.py"
      - ".github/workflows/check-operator-clusterrole.yaml"

# Permission forced by repo-level setting; only elevate on job-level
permissions:
  contents: read

jobs:
  clusterrole-idempotent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Regenerate ClusterRole templates from upstream RBAC
        run: |
          version=$(awk '/^appVersion:/ {print $2}' charts/datadog-operator/Chart.yaml | tr -d '"')
          regenerate() {
            upstream_url="https://raw.githubusercontent.com/DataDog/datadog-operator/v${version}/config/rbac/$1"
            echo "Regenerating $2 against ${upstream_url}"
            curl --silent --show-error --fail --location -o "$RUNNER_TEMP/role.yaml" "$upstream_url"
            python3 scripts/update-clusterrole.py "$RUNNER_TEMP/role.yaml" "charts/datadog-operator/templates/$2"
          }
          regenerate role.yaml clusterrole.yaml
          regenerate byoc/role.yaml clusterrole_byoc.yaml
      - name: Check for diff
        run: |
          for template in clusterrole.yaml clusterrole_byoc.yaml; do
            if ! git diff --exit-code -- "charts/datadog-operator/templates/${template}"; then
              echo "::error file=charts/datadog-operator/templates/${template}::The auto-generated section of ${template} does not match upstream RBAC for this operator version (diff above). It is regenerated on every operator release, so hand edits there will be dropped. Move manual RBAC rules after the END AUTO-GENERATED RULES marker."
              exit 1
            fi
          done
