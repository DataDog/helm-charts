name: Go Test Synthetics Private Location
on:
  push:
    paths:
      - 'test/synthetics-private-location/**'
      - 'charts/synthetics-private-location/**'
  pull_request:
    paths:
      - 'test/synthetics-private-location/**'
      - 'charts/synthetics-private-location/**'

# Permission forced by repo-level setting; only elevate on job-level
permissions:
  contents: read
  # packages: read

env:
  GO111MODULE: "on"
  PROJECTNAME: "helm-charts"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27
      id: go
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0
    - name: Add Datadog Helm repo
      run: helm repo add datadog https://helm.datadoghq.com && helm repo update
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: run Go tests
      run: |
        make unit-test-synthetics-private-location
