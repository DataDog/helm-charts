name: Test Synthetics Private Location
on:
  push:
    paths:
      - 'charts/synthetics-private-location/**'
      - 'test/synthetics-private-location/**'
      - '.github/workflows/test-synthetics-private-location.yaml'
  pull_request:
    paths:
      - 'charts/synthetics-private-location/**'
      - 'test/synthetics-private-location/**'
      - '.github/workflows/test-synthetics-private-location.yaml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s test/synthetics-private-location -v
