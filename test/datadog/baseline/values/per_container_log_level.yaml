datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  apm:
    portEnabled: true
  securityAgent:
    runtime:
      enabled: true
      # Pinned to cover the security-agent path.
      directSendFromSystemProbe: false

agents:
  image:
    # Above the floor, so the mirrored per-agent log levels render.
    tag: 7.85.0

  containers:
    agent:
      logLevel: info
    securityAgent:
      logLevel: debug
    processAgent:
      logLevel: warn
    traceAgent:
      logLevel: trace
    systemProbe:
      logLevel: error
