datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  apm:
    portEnabled: true
  securityAgent:
    runtime:
      enabled: true

agents:
  containers:
    agent:
      logLevel: info
    securityAgent:
      logLevel: debug
    processAgent:
      logLevel: warn
    traceAgent:
      logLevel: trace
    # Deliberately not hoisted onto the Agent container: system_probe_config.log_level is
    # unknown to the core Agent's config and is never streamed.
    systemProbe:
      logLevel: error
