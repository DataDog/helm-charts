datadog:
  kubelet:
    tlsVerify: false
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  securityAgent:
    runtime:
      enabled: true
      # Pinned to cover the security-agent path.
      directSendFromSystemProbe: false
    compliance:
      enabled: true
      # Pinned to cover the security-agent path.
      runInSystemProbe: false
  ignoreAutoConfig:
    - etcd
    - kube_scheduler
    - kube_controller_manager
providers:
  talos:
    enabled: true
