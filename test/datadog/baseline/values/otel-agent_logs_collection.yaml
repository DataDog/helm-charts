datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret

  otelCollector:
    enabled: true
    logs:
      enabled: true
    config: |
      receivers:
        file_log:
      exporters:
        debug:
      service:
        pipelines:
          logs:
            receivers: [file_log]
            exporters: [debug]
