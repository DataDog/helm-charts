# Exercise the process passwd migration while retaining security mount paths.
agents:
  image:
    tag: "7.86.0"
datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  securityAgent:
    compliance:
      enabled: true
      configMap: my-custom-benchmarks
      checkInterval: 45m
      containerInclude: "image:my-app"
      containerExclude: "image:datadog/agent"
      runInSystemProbe: true
    runtime:
      enabled: true
      directSendFromSystemProbe: true
      policies:
        configMap: my-custom-policies
