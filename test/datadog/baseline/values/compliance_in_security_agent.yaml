datadog:
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  securityAgent:
    compliance:
      enabled: true
      # Pinned to cover the security-agent path.
      runInSystemProbe: false
      checkInterval: 10m
      containerInclude: "kube_namespace:default"
      containerExclude: "kube_namespace:kube-system"
      xccdf:
        enabled: true

agents:
  image:
    tag: 7.85.0
