apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthetics-pl-synthetics-private-location-egress
  namespace: datadog-agent
  labels:
    helm.sh/chart: synthetics-private-location-0.18.0-dev.1
    app.kubernetes.io/name: synthetics-private-location
    app.kubernetes.io/instance: synthetics-pl
    app.kubernetes.io/version: "1.73.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synthetics-private-location
      app.kubernetes.io/instance: synthetics-pl
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Browsers reach the worker forward proxy on the pod IP (worker `managedPortRangeStart`/`End`).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthetics-private-location
              app.kubernetes.io/instance: synthetics-pl
      ports:
        - port: 30000
          endPort: 40000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: "10.1.0.0/16"
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - "0.0.0.0/8"
              - "10.0.0.0/8"
              - "100.64.0.0/10"
              - "127.0.0.0/8"
              - "169.254.0.0/16"
              - "172.16.0.0/12"
              - "192.0.0.0/24"
              - "192.0.2.0/24"
              - "192.31.196.0/24"
              - "192.52.193.0/24"
              - "192.88.99.0/24"
              - "192.168.0.0/16"
              - "192.175.48.0/24"
              - "198.18.0.0/15"
              - "198.51.100.0/24"
              - "203.0.113.0/24"
              - "224.0.0.0/4"
              - "240.0.0.0/4"
              - "203.0.114.0/24"
        - ipBlock:
            cidr: "::/0"
            except:
              - "::/128"
              - "::1/128"
              - "64:ff9b::/96"
              - "64:ff9b:1::/48"
              - "100::/64"
              - "2001::/23"
              - "2001:db8::/32"
              - "2002::/16"
              - "2620:4f:8000::/48"
              - "fc00::/7"
